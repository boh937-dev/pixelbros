<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pixel Brawl</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page">
    <header class="topbar">
      <h1>Pixel Brawl</h1>
      <p class="sub">A tiny 2D brawler (local build)</p>
    </header>

    <main class="card">
      <canvas id="game" width="800" height="450"></canvas>

      <div class="help">
        <div>
          <strong>P1:</strong> A/D move • W jump • S special
        </div>
        <div>
          <strong>P2:</strong> ←/→ move • ↑ jump • ↓ special
        </div>
        <div>
          <strong>Menu:</strong> Enter/Space play • Esc menu
        </div>
      </div>
    </main>

    <footer class="footer">
      Built with HTML Canvas + JavaScript.
    </footer>
  </div>

  <script src="game.js"></script>
</body>
</html>
